<section id="diagnosis" class="screen"><div class="panel"><div class="row"><span class="title">性格診断</span><span id="qCount" class="label"></span></div><p class="muted">6つの選択から傾向を推定。医学的・心理学的な正式検査ではありません。</p><div class="progress" id="qProgress"></div></div><div class="panel grow stack" style="justify-content:center"><div class="title" id="question"></div><div class="choice" id="answers"></div></div><button class="btn secondary" id="qBack">前の質問へ</button></section>

'use strict';
const KEY='persona-clash-tactical-mind-v02';const TYPES=[{id:'analysis',name:'分析型',color:'#83dce5',desc:'先読みと情報戦を得意とする',gear:'予測ゴーグル',unlock:'解析を通算5回使用'},{id:'intuition',name:'直感型',color:'#f3a17e',desc:'攻勢の連鎖で主導権を握る',gear:'閃光バイザー',unlock:'攻撃を通算8回使用'},{id:'empathy',name:'共感型',color:'#b3a0f7',desc:'守りと回復から逆転する',gear:'共鳴マント',unlock:'防御を通算5回使用'},{id:'will',name:'意志型',color:'#e8ca83',desc:'蓄積した集中力で突破する',gear:'不屈の仮面',unlock:'突破を通算4回使用'}];
const QUESTIONS=[['難題を前にしたら？','情報を集める','まず試す','相談する','最後まで粘る'],['勝負で重視するのは？','予測の精度','行動の速さ','相手の意図','持久力'],['失敗した時は？','原因を分析','別案を即実行','周囲と話す','反復練習'],['理想の能力は？','先を読む','瞬時に動く','気持ちを察する','耐え抜く'],['未知の場所では？','地図を確認','飛び込む','仲間を探す','着実に進む'],['対戦で得意なのは？','情報戦','速攻','防衛','逆転']];
const ACT=[{id:'attack',name:'攻撃',ap:2,detail:'15ダメージ',desc:'確定15ダメージ'},{id:'focus',name:'集中',ap:1,detail:'集中+2 / 防御併用時+1',desc:'集中力+2（防御と併用すると+1）'},{id:'scan',name:'解析',ap:1,detail:'次ターン攻撃+2',desc:'敵の次の行動候補を絞る'},{id:'guard',name:'防御',ap:1,detail:'軽減11 / 連続使用で低下',desc:'被ダメージ軽減11（連続防御で疲労、突破は貫通）'},{id:'break',name:'突破',ap:3,detail:'集中3消費 / 43ダメージ',desc:'集中3を消費して43ダメージ'},{id:'heal',name:'回復',ap:2,detail:'HP+13',desc:'HPを13回復'},{id:'feint',name:'フェイント',ap:1,detail:'次の攻撃+3',desc:'次のターンの攻撃+3'},{id:'counter',name:'迎撃',ap:2,detail:'反撃18〜20＋被害軽減4',desc:'敵の攻撃・突破時に18〜20反撃し、受けるダメージを4軽減。連続使用で反撃力が低下。攻撃されなければ不発'}];
function initial(){return {answers:[],type:0,parts:{hair:0,coat:0,gear:0,face:0,color:0},unlocked:false,counts:{attack:0,scan:0,guard:0,break:0},wins:0,losses:0,draws:0,xp:0,presets:[],skillPath:0,skillBuilds:[],solo:{puzzles:[],streak:0,best:0,medals:[]},battle:null}};
let s=initial(),tab='diagnosis',picked=[];
const ACTION_IDS=ACT.map(a=>a.id),COUNT_IDS=['attack','scan','guard','break','focus','heal','feint','counter'];
function plainObject(x){return x!==null&&typeof x==='object'&&!Array.isArray(x)}
function valid(x){return plainObject(x)&&Array.isArray(x.answers)&&x.answers.length<=6&&x.answers.every(a=>Number.isInteger(a)&&a>=0&&a<4)&&Number.isInteger(x.type)&&x.type>=0&&x.type<4&&plainObject(x.parts)&&plainObject(x.counts)&&Number.isFinite(x.xp)&&x.xp>=0&&x.xp<1e7&&Array.isArray(x.presets)&&x.presets.length<=4&&x.presets.every(p=>Array.isArray(p)&&p.length<=3&&p.every(a=>ACTION_IDS.includes(a)))&&(!('skillPath' in x)||(Number.isInteger(x.skillPath)&&x.skillPath>=0&&x.skillPath<3))&&(!('skillBuilds' in x)||(Array.isArray(x.skillBuilds)&&x.skillBuilds.length<=3&&x.skillBuilds.every(i=>Number.isInteger(i)&&i>=0&&i<3)))&&['hair','coat','gear','face','color'].every(k=>Number.isInteger(x.parts[k])&&x.parts[k]>=0&&x.parts[k]<=2)}
function safeHistory(h){return plainObject(h)&&Number.isInteger(h.turn)&&h.turn>=1&&h.turn<=24&&Array.isArray(h.player)&&h.player.length<=3&&h.player.every(id=>ACTION_IDS.includes(id))&&ACTION_IDS.includes(h.cpu)&&(!('cpuActions' in h)||(Array.isArray(h.cpuActions)&&h.cpuActions.length<=3&&h.cpuActions.every(id=>ACTION_IDS.includes(id))))&&Number.isFinite(h.dealt)&&h.dealt>=0&&h.dealt<=100&&Number.isFinite(h.taken)&&h.taken>=0&&h.taken<=100}
function safeSavedBattle(b){return plainObject(b)&&['hp','ehp','focus','efocus','turn'].every(k=>Number.isInteger(b[k]))&&b.hp>=0&&b.hp<=100&&b.ehp>=0&&b.ehp<=100&&b.focus>=0&&b.focus<=9&&b.efocus>=0&&b.efocus<=9&&b.turn>=1&&b.turn<=25&&typeof b.over==='boolean'&&Array.isArray(b.history)&&b.history.length<=24&&b.history.every(safeHistory)&&(!('matchIndex' in b)||(Number.isInteger(b.matchIndex)&&b.matchIndex>=0&&b.matchIndex<=1000000))}
function nonnegativeInt(v,limit=1000000){return Number.isSafeInteger(v)&&v>=0&&v<=limit?v:0}
function sanitizeState(v){
 const base=initial(),x={...base};
 x.answers=[...v.answers];x.type=v.type;x.parts={...base.parts,...Object.fromEntries(Object.keys(base.parts).map(k=>[k,v.parts[k]]))};
 x.unlocked=v.unlocked===true;x.xp=v.xp;
 x.wins=nonnegativeInt(v.wins);x.losses=nonnegativeInt(v.losses);x.draws=nonnegativeInt(v.draws);x.matchCount=nonnegativeInt(v.matchCount);
 x.counts=Object.fromEntries(COUNT_IDS.map(k=>[k,nonnegativeInt(v.counts[k])]));
 x.presets=v.presets.filter(p=>p.length&&legalActions(p,9)).map(p=>[...p]);
 x.skillPath=Number.isInteger(v.skillPath)&&v.skillPath>=0&&v.skillPath<=2?v.skillPath:0;
 x.skillBuilds=Array.isArray(v.skillBuilds)?v.skillBuilds.filter(i=>Number.isInteger(i)&&i>=0&&i<3).slice(0,3):[];
 const solo=plainObject(v.solo)?v.solo:{};
 x.solo={puzzles:Array.isArray(solo.puzzles)?[...new Set(solo.puzzles.filter(i=>Number.isInteger(i)&&i>=0&&i<3))]:[],streak:nonnegativeInt(solo.streak,999),best:nonnegativeInt(solo.best,999),medals:Array.isArray(solo.medals)?[...new Set(solo.medals.filter(i=>i==='triple'))]:[]};
 x.solo.best=Math.max(x.solo.best,x.solo.streak);
 x.battle=safeSavedBattle(v.battle)?JSON.parse(JSON.stringify(v.battle)):null;
 if(x.battle){let b=x.battle;b.combo=nonnegativeInt(b.combo,2);b.marked=nonnegativeInt(b.marked,1);b.feint=nonnegativeInt(b.feint,1);b.initiative=Number.isInteger(b.initiative)?Math.max(-3,Math.min(3,b.initiative)):0;b.scan=!!b.scan;b.challenge=b.challenge===true;b.matchIndex=nonnegativeInt(b.matchIndex);b.log=typeof b.log==='string'?b.log.slice(0,250):'';b.outcome=b.over&&['win','loss','draw'].includes(b.outcome)?b.outcome:null;}
 x.lastReplay=plainObject(v.lastReplay)&&Array.isArray(v.lastReplay.history)&&v.lastReplay.history.length<=24&&v.lastReplay.history.every(safeHistory)&&Number.isInteger(v.lastReplay.finalHp)&&v.lastReplay.finalHp>=0&&v.lastReplay.finalHp<=100&&Number.isInteger(v.lastReplay.finalEnemyHp)&&v.lastReplay.finalEnemyHp>=0&&v.lastReplay.finalEnemyHp<=100?JSON.parse(JSON.stringify(v.lastReplay)):null;
 if(!x.unlocked&&x.parts.gear===2)x.parts.gear=0;
 return x;
}
function loadSaveObject(v){if(!valid(v))throw Error('データ形式が不正です');return sanitizeState(v)}
try{let raw=localStorage.getItem(KEY);if(raw)s=loadSaveObject(JSON.parse(raw))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(s));let node=document.getElementById('storageStatus');if(node)node.textContent='端末内に保存済み';return true}catch(e){let node=document.getElementById('storageStatus');if(node)node.textContent='保存できません。記録画面から書き出してください';return false}}
function importSave(v){const next=loadSaveObject(v),old=s;try{localStorage.setItem(KEY,JSON.stringify(next));s=next;picked=[];return true}catch(e){s=old;throw Error('端末に保存できません。空き容量やプライベートモードを確認してください')}}
function el(id){return document.getElementById(id)}function show(t){tab=t;document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('on',x.id===t));document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x.dataset.tab===t));render()}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>show(b.dataset.tab));document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>show(b.dataset.go));
function type(){return TYPES[s.type]}function completed(){return s.answers.length===QUESTIONS.length}function score(){let z=[0,0,0,0];s.answers.forEach(a=>z[a]++);return z.indexOf(Math.max(...z))}
function renderQuiz(){let q=s.answers.length;el('qCount').textContent=q+'/6';el('qProgress').innerHTML=QUESTIONS.map((_,i)=>`<i class="${i<q?'done':''}"></i>`).join('');el('qBack').disabled=q===0;if(q===6){el('question').textContent='診断完了：'+type().name;el('answers').innerHTML='<button id="seeChar">キャラを確認する</button><button id="redoQuiz">再診断する</button>';el('seeChar').onclick=()=>show('character');el('redoQuiz').onclick=()=>{s.answers=[];save();renderQuiz()};return}el('question').textContent=QUESTIONS[q][0];el('answers').innerHTML='';QUESTIONS[q].slice(1).forEach((a,i)=>{let b=document.createElement('button');b.textContent=a;b.onclick=()=>{s.answers.push(i);s.type=score();save();renderQuiz()};el('answers').append(b)})}el('qBack').onclick=()=>{s.answers.pop();s.type=score();save();renderQuiz()};

 const guards=recent.filter(x=>x.player.includes('guard')).length;
 const turtles=recent.filter(x=>x.player.includes('guard')&&x.player.includes('focus')).length;

 const scanLoops=recent.filter(x=>x.player.includes('focus')&&x.player.includes('scan')).length;
 const breakLoops=recent.filter(x=>x.player.includes('break')).length;
 const tempoStrikes=recent.filter(x=>x.player.includes('attack')&&x.player.includes('focus')).length;
 const scanStrikes=recent.filter(x=>x.player.includes('scan')&&x.player.includes('attack')).length;

 const switchCount=h.slice(1).filter((x,i)=>{const prev=h[i].player;return prev.includes('guard')&&!prev.includes('attack')&&(x.player.includes('attack')||x.player.includes('break'))&&!x.player.includes('guard')}).length;
 const lastGuardOnly=last.includes('guard')&&!last.includes('attack');
 let move;
 if(tempoStrikes>=2)move=b.efocus>=3?'break':'guard';
 else if(switchCount>=1)move=(b.efocus>=3&&lastGuardOnly&&t%4===0)?'break':'attack';
 else if(breakLoops>=1)move=b.focus>=3?'guard':'attack';
 else if(scanStrikes>=2||feintStrikes>=2)move=b.efocus>=3?'break':'guard';
 else if(scanLoops>=2)move=b.efocus>=3?'break':'attack';
 else if(reactiveHits>=2)move=b.efocus>=3?'break':'guard';
 else if(turtles>=2)move=b.efocus>=3?'break':'focus';
 else if(counters>=2)move=b.efocus>=3?'break':'guard';
 else if(repeatedAttacks>=2)move=b.efocus>=3?'break':'guard';
 else if(attacks>=2)move=b.efocus>=3?'break':(t%3===0?'focus':'guard');
 else if(guards>=2&&b.efocus<3)move='focus';
 else if(b.focus>=3&&b.efocus>=3)move='break';
 else if(b.focus>=3&&t%3===0)move='attack';
 else if(style===0){if(b.ehp<=45&&t%3===0)move='heal';else if(b.efocus>=3&&t%3===1)move='break';else move=t%3===0?'guard':t%3===1?'focus':'attack'}

 else if(style===2){move=b.efocus>=3?'break':t%2===0?'focus':'guard'}

 else if(last.includes('attack')||last.includes('break'))move='guard';
 else if(b.efocus>=3)move='break';

 // Fair-play rule: CPU may only use completed turns and public state.
 // The current player's queued actions must not affect CPU move selection.

}
// CPUも3APで複合行動を構築。敵の確定行動ではなく構えを公開する。
function enemyPlan(b,choices=[]){
 const main=enemyMove(b),style=(b.matchIndex||0)%4;
 const history=(b.history||[]).slice(-3);
 const defensive=history.filter(h=>h.player.includes('guard')||h.player.includes('heal')).length>=2;
 const tempoPressure=history.filter(h=>h.player.includes('attack')&&h.player.includes('focus')).length>=2;
 let actions=[main];
 if(main==='break')return actions; // 突破は3AP
 if(main==='attack'){
   const switchThreat=(b.history||[]).slice(1).filter((x,i)=>{const prev=b.history[i].player;return prev.includes('guard')&&!prev.includes('attack')&&(x.player.includes('attack')||x.player.includes('break'))&&!x.player.includes('guard')}).length>=1;
   actions.push(switchThreat?'focus':style===1&&b.efocus<3?'focus':defensive?'focus':'guard');
 }else if(main==='guard'){
   const pressure=history.filter(h=>h.player.includes('attack')||h.player.includes('break')).length;
   const switchThreat=(b.history||[]).slice(1).filter((x,i)=>{const prev=b.history[i].player;return prev.includes('guard')&&!prev.includes('attack')&&(x.player.includes('attack')||x.player.includes('break'))&&!x.player.includes('guard')}).length>=1;
   actions.push(pressure>=1||tempoPressure||switchThreat?'attack':'focus'); // Guard-and-strike is a tradeoff; do not respond to unseen future choices.
 }else if(main==='focus'){
   if(defensive&&style===1)actions.push('attack');
   else actions.push('guard');
 }else if(main==='heal')actions.push('guard');
 return actions;
}
function cpuGuardValue(plan){return plan.includes('guard')? (plan.includes('attack')?6:plan.includes('focus')?7:11):0}
function cpuFocusGain(plan){return plan.includes('focus')?2:0}
function cpuAttackDamage(plan,choices,history,hasAttack,matchIndex=0){
 const main=plan[0];
 const tempoPressure=(history||[]).slice(-3).filter(h=>h.player.includes('attack')&&h.player.includes('focus')).length>=2;
 const tacticalPunish=tempoPressure&&plan.includes('guard')&&plan.includes('attack')?11:0;

}

function guardSwitchBonus(b,choices){

function legalActions(actions,startingFocus){

 if(!Number.isInteger(focus)||focus<0||focus>9)return false;

  const action=ACT.find(a=>a.id===id);
  if(!action)return false;
  ap+=action.ap;
  if(ap>3)return false;
  if(id==='focus')focus=Math.min(9,focus+focusGain(actions));
  if(id==='break'){if(focus<3)return false;focus-=3;}
 }

}

function resolve(){let b=s.battle;if(!b||b.over||!legalActions(picked,b.focus))return;let guard=0,dmg=0,heal=0,lines=[];let oldCombo=b.combo||0,oldMark=b.marked||0,oldFeint=b.feint||0;let hasAttack=picked.includes('attack');let nextFeint=picked.includes('feint')?1:0;let counter=picked.includes('counter');let scan=picked.includes('scan');const cpuPlan=enemyPlan(b,picked),move=cpuPlan[0];for(let id of picked){s.counts[id]=(s.counts[id]||0)+1;if(id==='focus')b.focus=Math.min(9,b.focus+focusGain(picked));if(id==='guard')guard+=guardStrength(b,picked);if(id==='heal')heal+=13;if(id==='attack')dmg+=((oldCombo>=2)?12:15)-(picked.includes('counter')?4:0)-(picked.includes('guard')?3:0)-(picked.includes('scan')||picked.includes('feint')?3:0);if(id==='break'){if(b.focus<3)continue;b.focus-=3;dmg+=43;hasAttack=true}if(id==='scan')b.scan=true}let edmg=cpuAttackDamage(cpuPlan,picked,b.history,hasAttack,b.matchIndex),eguard=picked.includes('break')?Math.floor(cpuGuardValue(cpuPlan)/2):cpuGuardValue(cpuPlan),eheal=move==='heal'?12:0;if(move==='break')b.efocus=Math.max(0,b.efocus-3);b.efocus=Math.min(9,b.efocus+cpuFocusGain(cpuPlan));if(hasAttack){let bonus=(oldCombo>=2?6:0)+(oldMark?2:0)+(oldFeint?3:0);dmg+=bonus;if(bonus)lines.push('連携・解析・フェイント補正 +'+bonus)}if(guardSwitchBonus(b,picked)){dmg+=5;lines.push('防御からの切り返し +5')}if(counter&&(cpuPlan.includes('attack')||cpuPlan.includes('break'))){dmg+=counterStrength(b);guard+=4;lines.push('迎撃成功 +'+counterStrength(b)+' / 被害軽減4')}b.combo=hasAttack?Math.min(2,oldCombo+1):0;b.marked=scan?1:0;b.scan=scan;b.feint=nextFeint;b.hp=Math.max(0,Math.min(100,b.hp+heal-Math.max(0,edmg-guard)));b.ehp=Math.max(0,Math.min(100,b.ehp+eheal-Math.max(0,dmg-eguard)));lines.push('自分 '+picked.map(x=>ACT.find(a=>a.id===x).name).join('＋')+' / CPU '+cpuPlan.map(id=>ACT.find(a=>a.id===id).name).join('＋'));lines.push('与ダメージ '+Math.max(0,dmg-eguard)+' / 被ダメージ '+Math.max(0,edmg-guard));b.history=b.history||[];b.history.push({turn:b.turn,player:[...picked],cpu:move,cpuAc el('commit').onclick=resolve;el('undo').onclick=()=>{picked=[];renderBattle()};el('restart').onclick=()=>{if(confirm('新しい対戦を開始しますか？'))newBattle()};
const SKILL_PATHS=[{name:'観測者',detail:'解析・相手の行動記録を極める',goal:'解析を10回使用',key:'scan'},{name:'連撃者',detail:'連続攻撃を極める',goal:'攻撃を10回使用',key:'attack'},{name:'守護者',detail:'防御から反撃を極める',goal:'防御を10回使用',key:'guard'}];
function skillRank(i){let count=Number(s.counts[SKILL_PATHS[i].key]||0);return Math.min(3,Math.floor(count/5))}
function renderSkills(){if(!Number.isInteger(s.skillPath)||s.skillPath<0||s.skillPath>2)s.skillPath=0;if(!Array.isArray(s.skillBuilds))s.skillBuilds=[];let lvl=1+Math.floor(s.xp/50);el('skillSummary').textContent='Lv.'+lvl+' ｜選択：'+SKILL_PATHS[s.skillPath].name+' ｜熟練 '+skillRank(s.skillPath)+'/3 ｜'+SKILL_PATHS[s.skillPath].goal+'（戦闘能力への数値補正なし）';el('skillChoices').innerHTML='';SKILL_PATHS.forEach((path,i)=>{let b=document.createElement('button');b.textContent=path.name+' '+skillRank(i)+'/3';b.className=i===s.skillPath?'selected':'';b.title=path.detail;b.onclick=()=>{s.skillPath=i;save();renderSkills()};el('skillChoices').append(b)});el('skillBuilds').innerHTML='';s.skillBuilds.forEach((i,n)=>{let b=document.createElement('button');b.textContent='保存'+(n+1)+' '+SKILL_PATHS[i].name;b.onclick=()=>{s.skillPath=i;save();renderSkills()};el('skillBuilds').append(b)})}
function renderRecords(){renderSkills();renderReplay();el('stats').textContent='勝利 '+s.wins+' / 引分 '+s.draws+' / 敗北 '+s.losses+' / EXP '+s.xp+' / Lv.'+(1+Math.floor(s.xp/50));el('achievements').textContent='CPU戦 '+(s.matchCount||0)+'回 · 称号：'+(s.wins>=10?'百戦の戦術家':s.wins>=3?'駆け出し戦術家':'見習い戦術家')+'　限定パーツ：'+(s.unlocked?'解放':'未解放');el('presets').innerHTML='';s.presets.forEach((p,i)=>{let b=document.createElement('button');b.className='btn secondary';b.textContent=(i+1)+'. '+p.map(x=>ACT.find(a=>a.id===x).name).join('＋');b.onclick=()=>{if(!s.battle||s.battle.over)newBattle();picked=legalActions(p,s.battle.focus)?[...p]:[];show('battle')};el('presets').append(b)});el('savePreset').disabled=!picked.length;el('storageStatus').textContent='保存先：このブラウザの端末内ストレージ（利用できる場合）'}
el('skillReset').onclick=()=>{s.skillPath=0;save();renderRecords()};el('skillSave').onclick=()=>{if(!Array.isArray(s.skillBuilds))s.skillBuilds=[];s.skillBuilds=[s.skillPath,...s.skillBuilds.filter(x=>x!==s.skillPath)].slice(0,3);save();renderRecords()};el('savePreset').onclick=()=>{if(!picked.length)return;s.presets.unshift([...picked]);s.presets=s.presets.slice(0,4);save();renderRecords()};el('export').onclick=()=>{let blob=new Blob([JSON.stringify(s,null,2)],{type:'application/json'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='persona-clash-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};el('import').onclick=()=>el('importFile').click();el('importFile').onchange=async e=>{try{let f=e.target.files[0];if(!f)return;if(f.size>200000)throw Error('ファイルが大きすぎます（上限200KB）');let v=JSON.parse(await f.text());importSave(v);render();alert('セーブを読み込みました。対戦途中の状態も復元されます。')}catch(err){alert('読み込み失敗：'+err.message)}finally{e.target.value=''}};el('reset').onclick=()=>{if(confirm('全記録を消去しますか？')){s=initial();picked=[];save();show('diagnosis')}};

const PUZZLES=[{q:'敵の次の攻撃は17。自分のHPは14。1APで生存するには？',a:['攻撃','防御','解析','フェイント'],correct:1,why:'初回防御は11軽減。17−11=6なのでHP8で生存。'},{q:'集中力3、敵HP30、使用可能AP3。確実に倒せる行動は？',a:['突破','攻撃','集中','防御'],correct:0,why:'突破は集中3と3APを使い、43ダメージ。'},{q:'次ターンに攻撃する予定。1APで追加ダメージを仕込むなら？',a:['防御','解析','回復','突破'],correct:1,why:'解析による印は次ターンの攻撃に+2。'}];
function ensureSolo(){if(!s.solo||typeof s.solo!=='object')s.solo={puzzles:[],streak:0,best:0,medals:[]};if(!Array.isArray(s.solo.puzzles))s.solo.puzzles=[];if(!Array.isArray(s.solo.medals))s.solo.medals=[];s.solo.streak=Math.max(0,Math.min(999,Number(s.solo.streak)||0));s.solo.best=Math.max(0,Math.min(999,Number(s.solo.best)||0));}
let collectionPage=0;function renderSolo(){ensureSolo();let next=PUZZLES.findIndex((p,i)=>!s.solo.puzzles.includes(i));let q=PUZZLES[next];el('puzzleInfo').textContent=q?('問題 '+(next+1)+'/3：'+q.q):'全問クリア！ 何度でも復習できます。';el('puzzleChoices').innerHTML='';if(q)q.a.forEach((a,i)=>{let b=document.createElement('button');b.textContent=a;b.onclick=()=>{if(i===q.correct){s.solo.puzzles.push(next);el('puzzleFeedback').textContent='正解！ '+q.why;save();renderSolo()}else{el('puzzleFeedback').textContent='不正解。行動コストと確定効果を確認しよう。'}};el('puzzleChoices').append(b)});el('challengeInfo').textContent='現在 '+s.solo.streak+'連勝 / 最高 '+s.solo.best+'連勝。3連勝で限定エンブレム。';let pageSize=window.matchMedia&&window.matchMedia('(max-height:620px)').matches?1:2;collectionPage=Math.min(collectionPage,Math.ceil(6/pageSize)-1);let all=[['予測ゴーグル','分析型で解析5回'],['閃光バイザー','直感型で攻撃8回'],['共鳴マント','共感型で防御5回'],['不屈の仮面','意志型で突破4回'],['戦術学徒バッジ','パズル3問正解'],['連勝エンブレム','CPUチャレンジ3連勝']];el('collectionInfo').textContent='性格専用装備は該当性格でのみ解放。戦闘性能への補正なし。';el('collectionItems').innerHTML='';all.slice(collectionPage*pageSize,collectionPage*pageSize+pageSize).forEach((x,j)=>{let i=collectionPage*pageSize+j;let owned=i<4?(s.type===i&&s.unlocked):i===4?s.solo.puzzles.length===3:s.solo.medals.includes('triple');let d=document.createElement('div');d.className='notice';d.textContent=(owned?'◆ 獲得 ':'◇ 未獲得 ')+x[0]+' · '+x[1];el('collectionItems').append(d)});el('collectionPage').textContent=(collectionPage+1)+'/'+Math.ceil(all.length/pageSize);el('collectionPrev').disabled=collectionPage===0;el('collectionNext').disabled=collectionPage===Math.ceil(all.length/pageSize)-1}
el('collectionPrev').onclick=()=>{collectionPage=Math.max(0,collectionPage-1);renderSolo()};el('collectionNext').onclick=()=>{collectionPage=Math.min(window.matchMedia&&window.matchMedia('(max-height:620px)').matches?5:2,collectionPage+1);renderSolo()};
el('challengeStart').onclick=()=>{ensureSolo();newBattle();s.battle.challenge=true;s.battle.log='チャレンジ '+(s.solo.streak+1)+'戦目。3連勝でエンブレム獲得。';save();show('battle')};el('challengeReset').onclick=()=>{ensureSolo();s.solo.streak=0;save();renderSolo()};

let replayIndex=0;
function replayData(){let r=s.lastReplay;if(!r||!Array.isArray(r.history))return [];return r.history.filter(h=>h&&Number.isInteger(h.turn)&&Array.isArray(h.player)&&typeof h.cpu==='string').slice(-24)}
function renderReplay(){let hs=replayData();replayIndex=Math.max(0,Math.min(replayIndex,Math.max(0,hs.length-1)));el('replaySummary').textContent=hs.length?'保存済み '+hs.length+'ターン · '+(s.lastReplay.outcome==='win'?'勝利':s.lastReplay.outcome==='loss'?'敗北':s.lastReplay.outcome==='draw'?'引分':'結果未記録')+' · 自分 '+s.lastReplay.finalHp+'HP / 敵 '+s.lastReplay.finalEnemyHp+'HP':'記録は対戦後に保存されます';el('replayPosition').textContent=hs.length?(replayIndex+1)+'/'+hs.length:'0/0';let h=hs[replayIndex];el('replayDetail').textContent=h?'TURN '+h.turn+'｜自分：'+h.player.map(id=>{let a=ACT.find(a=>a.id===id);return a?a.name:'不明'}).join('＋')+'｜敵：'+(Array.isArray(h.cpuActions)?h.cpuActions:[h.cpu]).map(id=>(ACT.find(a=>a.id===id)||{name:'不明'}).name).join('＋')+'｜与 '+h.dealt+' / 被 '+h.taken:'対戦をプレイすると、ここで行動を振り返れます';el('replayPrev').disabled=!hs.length||replayIndex===0;el('replayNext').disabled=!hs.length||replayIndex===hs.length-1;el('replayExport').disabled=!hs.length}
el('replayPrev').onclick=()=>{replayIndex--;renderReplay()};el('replayNext').onclick=()=>{replayIndex++;renderReplay()};
el('replayExport').onclick=()=>{let data={format:'persona-clash-replay-v1',...s.lastReplay};let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='persona-clash-replay.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};

let recordPage=0;
function renderRecordPage(){const panels=[...document.querySelectorAll('#records>.panel')];if(!panels.length)return;recordPage=Math.min(recordPage,panels.length-1);panels.forEach((p,i)=>p.classList.toggle('recordActive',i===recordPage));el('recordPageLabel').textContent='記録 '+(recordPage+1)+' / '+panels.length;el('recordPrev').disabled=recordPage===0;el('recordNext').disabled=recordPage===panels.length-1;}
el('recordPrev').onclick=()=>{recordPage--;renderRecordPage()};el('recordNext').onclick=()=>{recordPage++;renderRecordPage()};
function render(){if(tab==='records')renderRecordPage();if(tab==='solo')renderSolo();if(tab==='diagnosis')renderQuiz();if(tab==='character')renderCharacter();if(tab==='battle')renderBattle();if(tab==='records')renderRecords()};ensureSolo();show(completed()?'battle':'diagnosis');
